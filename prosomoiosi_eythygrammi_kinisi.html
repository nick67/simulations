<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Προσομοίωση Ευθύγραμμης Κίνησης</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-page:   #dde3ea;       /* σελίδα: μεσαίο γκρι-μπλε */
  --bg-panel:  #eef1f5;       /* panels/controls */
  --bg-stage:  #ffffff;       /* σκηνή: λευκό */
  --text:      #1a1a1a;
  --text2:     #5a6070;
  --border:    rgba(0,0,0,0.14);
  --border2:   rgba(0,0,0,0.24);
  --ctrl-bg:   #e0e4ea;
  --ctrl-border: #b8bfc9;
  --info-bg:   #daeaf8; --info-text: #0f4a80; --info-border: #8dbde8;
  --danger-bg: #fce8e8; --danger-text: #9b2020;
  --radius:    7px; --radius-lg: 12px;
  --stage-shadow: 0 2px 12px rgba(0,0,0,0.18);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:  #1a1d23;
    --bg-panel: #23272f;
    --bg-stage: #2c3040;
    --text:     #e8eaf0;
    --text2:    #8892a4;
    --border:   rgba(255,255,255,0.10);
    --border2:  rgba(255,255,255,0.20);
    --ctrl-bg:  #2c3040;
    --ctrl-border: #404760;
    --info-bg:  #0c2a44; --info-text: #7ab8f0; --info-border: #2060a0;
    --danger-bg:#3a1a1a; --danger-text:#f09595;
    --stage-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg-page);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 1.4rem 1rem;
}

h1 { font-size: 17px; font-weight: 600; margin-bottom: 1rem; text-align: center; color: var(--text); }

.sim-wrap { width: 100%; max-width: 720px; }

/* ── Controls ── */
.ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

.ctrl-box {
  background: var(--ctrl-bg);
  border: 1px solid var(--ctrl-border);
  border-radius: var(--radius);
  padding: 7px 10px;
}

.ctrl-label { font-size: 11px; color: var(--text2); margin-bottom: 3px; font-weight: 500; }

.ctrl-row { display: flex; align-items: center; gap: 7px; }
.ctrl-row input[type=range] {
  flex: 1; accent-color: #5580aa;
  height: 3px; cursor: pointer;
}
.ctrl-val { font-size: 12px; font-weight: 600; min-width: 44px; text-align: right; color: var(--text); }

/* Speed buttons */
.speed-box {
  background: var(--ctrl-bg);
  border: 1px solid var(--ctrl-border);
  border-radius: var(--radius);
  padding: 7px 10px;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.speed-label { font-size: 11px; color: var(--text2); white-space: nowrap; font-weight: 500; }
.speed-btns  { display: flex; gap: 6px; }
.speed-btn {
  padding: 3px 14px;
  border: 1px solid var(--ctrl-border);
  border-radius: 5px;
  background: var(--bg-panel);
  color: var(--text);
  font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: background 0.12s;
}
.speed-btn:hover { background: var(--bg-stage); }
.speed-btn.sel {
  background: #5580aa;
  color: #ffffff;
  border-color: #3a6090;
  font-weight: 700;
}

/* ── Stage ── */
.stage-wrap {
  background: var(--bg-stage);
  border: 2px solid #a0aabb;
  border-radius: var(--radius-lg);
  padding: 10px;
  margin-bottom: 10px;
  cursor: crosshair;
  position: relative;
  box-shadow: var(--stage-shadow);
}

canvas { display: block; width: 100%; border-radius: 5px; }

/* Bottom row */
.bottom-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }

.time-display {
  background: var(--bg-panel); border: 1px solid var(--ctrl-border);
  border-radius: var(--radius); padding: 6px 14px;
  display: flex; align-items: baseline; gap: 7px;
}
.time-label { font-size: 11px; color: var(--text2); font-weight: 500; }
.time-val   { font-size: 20px; font-weight: 600; color: var(--text); }

.vel-card {
  background: var(--bg-panel); border: 1px solid var(--ctrl-border);
  border-radius: var(--radius); padding: 6px 12px;
  display: flex; align-items: center; gap: 8px;
}
.vel-label { font-size: 11px; color: var(--text2); font-weight: 500; }
.vel-val   { font-size: 17px; font-weight: 600; color: var(--text); }

/* Buttons */
.btn-row { display: flex; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }

button {
  padding: 5px 14px;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg-panel); color: var(--text);
  font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: background 0.12s;
}
button:hover  { background: var(--bg-stage); }
button:active { transform: scale(0.97); }
button.active  {
  background: var(--info-bg);
  color: var(--info-text);
  border-color: var(--info-border);
  font-weight: 600;
}
button.toggled { color: var(--text2); border-style: dashed; }

/* Log */
.log-wrap {
  background: var(--bg-panel); border: 1px solid var(--ctrl-border);
  border-radius: var(--radius-lg); padding: 9px 11px;
  max-height: 190px; overflow-y: auto;
}
.log-title {
  font-size: 11px; color: var(--text2); margin-bottom: 5px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 500;
}
.col-toggle-row { display: flex; gap: 7px; margin-bottom: 7px; align-items: center; }
.col-toggle-label { font-size: 11px; color: var(--text2); }

.log-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.log-table th {
  color: var(--text2); text-align: left; padding: 2px 5px;
  border-bottom: 1px solid var(--ctrl-border); font-weight: 500;
}
.log-table td { padding: 3px 5px; border-bottom: 0.5px solid var(--border); color: var(--text); }
.col-v-h.hidden { display: none; }

@media (max-width: 480px) { .ctrl-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="sim-wrap">
  <h1>Προσομοίωση Ευθύγραμμης Κίνησης</h1>

  <div class="ctrl-grid">
    <div class="ctrl-box">
      <div class="ctrl-label">Αρχική ταχύτητα v₀ (m/s)</div>
      <div class="ctrl-row">
        <input type="range" id="v0" min="-10" max="10" step="0.5" value="0">
        <span class="ctrl-val" id="v0-val">0.0</span>
      </div>
    </div>
    <div class="ctrl-box">
      <div class="ctrl-label">Γωνία κλίσης θ (°)</div>
      <div class="ctrl-row">
        <input type="range" id="angle" min="-30" max="30" step="1" value="0">
        <span class="ctrl-val" id="angle-val">0°</span>
      </div>
    </div>
    <div class="ctrl-box">
      <div class="ctrl-label">Συντελεστής τριβής μ</div>
      <div class="ctrl-row">
        <input type="range" id="mu" min="0" max="0.8" step="0.01" value="0.1">
        <span class="ctrl-val" id="mu-val">0.10</span>
      </div>
    </div>
    <div class="ctrl-box">
      <div class="ctrl-label">Μάζα m (kg)</div>
      <div class="ctrl-row">
        <input type="range" id="mass" min="0.5" max="3" step="0.5" value="1">
        <span class="ctrl-val" id="mass-val">1.0</span>
      </div>
    </div>
  </div>

  <div class="speed-box">
    <span class="speed-label">Ταχύτητα προσομοίωσης:</span>
    <div class="speed-btns">
      <button class="speed-btn" data-speed="0.5">50%</button>
      <button class="speed-btn" data-speed="0.75">75%</button>
      <button class="speed-btn sel" data-speed="1">100%</button>
    </div>
  </div>

  <div class="stage-wrap" id="stage-wrap">
    <canvas id="canvas" height="165"></canvas>
  </div>

  <div class="bottom-row">
    <div class="time-display">
      <span class="time-label">t (s)</span>
      <span class="time-val" id="disp-t">0.00</span>
    </div>
    <div class="vel-card" id="vel-card" style="display:none">
      <span class="vel-label">v (m/s)</span>
      <span class="vel-val" id="disp-v">0.00</span>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-start" class="active">▶ Εκκίνηση</button>
    <button id="btn-reset">↺ Επανέναρξη</button>
    <button id="btn-tog-v" class="toggled">v κρυφή</button>
    <button id="btn-fullscreen">⛶ Πλήρης οθόνη</button>
    <button id="btn-log">📋 Καταγραφή κλικ</button>
    <button id="btn-clear-log">Καθαρισμός πίνακα</button>
  </div>

  <div class="log-wrap">
    <div class="log-title">
      <span>Καταγεγραμμένες μετρήσεις <span style="color:var(--text2)">(κλικ στη σκηνή)</span></span>
      <span id="log-count" style="font-weight:600">0 σημεία</span>
    </div>
    <div class="col-toggle-row">
      <span class="col-toggle-label">Στήλη v:</span>
      <button id="tog-v-log" class="toggled" style="padding:2px 9px;font-size:11px">κρυφή</button>
    </div>
    <table class="log-table">
      <thead><tr>
        <th>#</th><th>t (s)</th><th>x (m)</th>
        <th class="col-v-h hidden">v (m/s)</th>
      </tr></thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const G      = 9.81;

let state    = {x:0, v:0, t:0, running:false, logMode:false};
let logData  = [], animId = null, lastTime = null;
let showVel  = false, showVLog = false;
let simSpeed = 1.0;

function getParams(){
  return {
    v0:    parseFloat(document.getElementById('v0').value),
    angle: parseFloat(document.getElementById('angle').value),
    mu:    parseFloat(document.getElementById('mu').value),
    mass:  parseFloat(document.getElementById('mass').value)
  };
}

function computeAccel(v, angle, mu, mass){
  const rad    = angle * Math.PI / 180;
  const Fg_x   = mass * G * Math.sin(rad);
  const Fn     = mass * G * Math.cos(rad);
  const Ff_max = mu * Fn;
  if(Math.abs(v) < 0.001){
    if(Math.abs(Fg_x) <= Ff_max) return 0;
    return (Fg_x - Math.sign(Fg_x) * Ff_max) / mass;
  }
  return (Fg_x - Math.sign(v) * Ff_max) / mass;
}

function isFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function isDark(){ return window.matchMedia('(prefers-color-scheme:dark)').matches; }

function resize(){
  if(isFS()){
    canvas.width  = window.screen.width;
    canvas.height = window.screen.height;
  } else {
    canvas.width  = canvas.parentElement.offsetWidth - 20;
    canvas.height = 165;
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function draw(){
  const p    = getParams();
  const W    = canvas.width, H = canvas.height;
  const dark = isDark();
  const fs   = isFS();

  ctx.clearRect(0,0,W,H);

  /* Stage background — white (light) or dark-blue (dark), same in fullscreen */
  const stageBg  = dark ? '#2c3040' : '#ffffff';
  const trackCol = dark ? '#7080a0' : '#8899bb';
  const tickCol  = dark ? '#4a5570' : '#aabbcc';
  const textCol  = dark ? '#c0c8d8' : '#334466';

  ctx.fillStyle = stageBg;
  ctx.fillRect(0,0,W,H);

  /* Border in fullscreen */
  if(fs){
    ctx.strokeStyle = dark ? '#404760' : '#a0aabb';
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,W-2,H-2);
  }

  const fSz      = fs ? 16 : 10;
  const rad      = p.angle * Math.PI / 180;
  const trackLen = W * 0.88;
  const maxX     = 18;
  const pxPerM   = (trackLen * 0.82) / (maxX * 2);
  const centerY  = fs ? H * 0.50 : H/2 + 6;

  ctx.save();
  ctx.translate(W/2, centerY);
  ctx.rotate(rad);

  /* Track line */
  ctx.strokeStyle=trackCol; ctx.lineWidth=fs?3:2;
  ctx.beginPath(); ctx.moveTo(-trackLen/2,0); ctx.lineTo(trackLen/2,0); ctx.stroke();

  /* Ticks + labels */
  ctx.strokeStyle=tickCol; ctx.lineWidth=1;
  ctx.fillStyle=textCol;
  ctx.font=fSz+'px system-ui,sans-serif'; ctx.textAlign='center';
  for(let xi=-maxX; xi<=maxX; xi+=3){
    const px=xi*pxPerM;
    if(Math.abs(px)>trackLen/2-5) continue;
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,fs?10:7); ctx.stroke();
    ctx.fillText(xi, px, fs?26:19);
  }
  ctx.strokeStyle=dark?'#6070a0':'#99aacc'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,6); ctx.stroke();
  ctx.fillStyle=textCol; ctx.fillText('0',0,fs?26:19);

  ctx.textAlign='right'; ctx.fillStyle=tickCol;
  ctx.font=fSz+'px system-ui,sans-serif';
  ctx.fillText('x (m)', trackLen/2, -6);

  /* Object */
  const objPx = Math.max(-trackLen/2+20, Math.min(trackLen/2-20, state.x*pxPerM));
  const bw=fs?48:26, bh=fs?30:18;

  ctx.strokeStyle='#4488cc'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(objPx,2); ctx.lineTo(objPx,0); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  ctx.translate(objPx,-bh-(fs?28:14));
  ctx.fillStyle='#1a5fa0';
  ctx.font=(fs?15:10)+'px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('x = '+state.x.toFixed(2)+' m',0,0);
  ctx.restore();

  ctx.save();
  ctx.translate(objPx,-bh/2);
  ctx.fillStyle='#3a7acc'; ctx.strokeStyle='#1a5fa0'; ctx.lineWidth=1.5;
  ctx.fillRect(-bw/2,-bh/2,bw,bh);
  ctx.strokeRect(-bw/2,-bh/2,bw,bh);
  ctx.fillStyle='#ffffff';
  ctx.font=(fs?13:9)+'px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('m',0,0);

  if(state.running && Math.abs(state.v)>0.05){
    const al=Math.min(fs?80:55, Math.abs(state.v)*4);
    const dir=Math.sign(state.v);
    const sx=dir*(bw/2+2);
    ctx.strokeStyle='#4a9020'; ctx.fillStyle='#4a9020'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx+dir*al,0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx+dir*al+dir*6,0);
    ctx.lineTo(sx+dir*al-dir*5,-5);
    ctx.lineTo(sx+dir*al-dir*5,5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  /* ── Fullscreen overlays ── */
  if(fs){
    /* Chronometer — bottom centre */
    const cw=200, ch=72, cx2=W/2-cw/2, cy2=H-ch-20;
    rr(ctx, cx2, cy2, cw, ch, 12);
    ctx.fillStyle = dark ? 'rgba(20,25,40,0.90)' : 'rgba(240,244,252,0.92)';
    ctx.fill();
    ctx.strokeStyle = dark?'#404760':'#a0aabb'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle = dark?'#8892a4':'#5a6070';
    ctx.font='13px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText('t (s)', W/2, cy2+22);
    ctx.fillStyle = dark?'#e8eaf0':'#1a1a1a';
    ctx.font='bold 36px system-ui,sans-serif';
    ctx.fillText(state.t.toFixed(2), W/2, cy2+60);

    /* Control bar */
    const barW=440, barH=52, bx=W/2-barW/2, by=cy2-barH-14;
    rr(ctx, bx, by, barW, barH, 10);
    ctx.fillStyle = dark?'rgba(20,25,40,0.88)':'rgba(240,244,252,0.92)';
    ctx.fill();
    ctx.strokeStyle=dark?'#404760':'#a0aabb'; ctx.lineWidth=1; ctx.stroke();

    /* All FS buttons: light background, black text */
    const btnBg = '#e8ecf2';
    const btnFg = '#111111';
    drawFSBtn(W/2-200, by+10, 88,  32, state.running?'⏸ Παύση':'▶ Play',           btnBg, btnFg);
    drawFSBtn(W/2-100, by+10, 90,  32, '↺ Restart',                                 btnBg, btnFg);
    drawFSBtn(W/2+0,   by+10, 108, 32, state.logMode?'🔴 Stop log':'📋 Log κλικ',  state.logMode?'#f5d0d0':btnBg, btnFg);

    /* Slow motion badge */
    if(simSpeed < 1){
      rr(ctx,14,14,116,30,7);
      ctx.fillStyle='rgba(160,90,0,0.90)'; ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.font='bold 13px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillText('× '+simSpeed.toFixed(2)+' speed', 24, 33);
    }
  } else {
    /* Normal slow motion badge */
    if(simSpeed < 1){
      rr(ctx,8,8,108,26,6);
      ctx.fillStyle='rgba(160,90,0,0.90)'; ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.font='bold 11px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillText('× '+simSpeed.toFixed(2)+' speed', 16, 25);
    }
  }

  document.getElementById('disp-t').textContent = state.t.toFixed(2);
  document.getElementById('disp-v').textContent = state.v.toFixed(2);
}

function drawFSBtn(x, y, w, h, label, bg, fg){
  rr(ctx, x, y, w, h, 7);
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle=fg; ctx.font='bold 13px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2);
  ctx.textBaseline='alphabetic';
}

function getFSBtnRects(W,H){
  const barH=52, ch=72, cy2=H-ch-20, by=cy2-barH-14;
  return [
    {id:'play',    x:W/2-200, y:by+10, w:88,  h:32},
    {id:'restart', x:W/2-100, y:by+10, w:90,  h:32},
    {id:'log',     x:W/2+0,   y:by+10, w:108, h:32},
  ];
}

/* ── Sim loop ── */
function simStep(ts){
  if(!state.running) return;
  if(lastTime===null) lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.05)*simSpeed;
  lastTime=ts;

  const p=getParams();
  const a=computeAccel(state.v,p.angle,p.mu,p.mass);
  const prevV=state.v;
  state.v+=a*dt;

  if(Math.abs(prevV)>0.001 && Math.sign(state.v)!==Math.sign(prevV)){
    state.v=0;
    if(computeAccel(0,p.angle,p.mu,p.mass)===0){ state.running=false; syncStartBtn(); }
  }
  state.x+=state.v*dt; state.t+=dt;
  if(Math.abs(state.x)>30){ state.running=false; syncStartBtn(); }

  draw();
  if(state.running) animId=requestAnimationFrame(simStep);
}

function syncStartBtn(){
  const btn=document.getElementById('btn-start');
  btn.textContent=state.running?'⏸ Παύση':(state.t>0?'▶ Συνέχεια':'▶ Εκκίνηση');
  btn.classList.toggle('active',!state.running);
}

function resetSim(){
  if(animId) cancelAnimationFrame(animId);
  animId=null; lastTime=null;
  const p=getParams();
  state={x:0,v:p.v0,t:0,running:false,logMode:state.logMode};
  syncStartBtn(); draw();
}

function clearLog(){
  logData=[];
  document.getElementById('log-body').innerHTML='';
  document.getElementById('log-count').textContent='0 σημεία';
}

function toggleRun(){
  if(state.running){
    state.running=false;
    if(animId) cancelAnimationFrame(animId);
    animId=null; lastTime=null;
  } else {
    if(state.t===0){const p=getParams();state.v=p.v0;}
    state.running=true;
    lastTime=null; animId=requestAnimationFrame(simStep);
  }
  syncStartBtn();
}

function toggleLog(){
  state.logMode=!state.logMode;
  const btn=document.getElementById('btn-log');
  btn.textContent       =state.logMode?'🔴 Ακύρωση καταγραφής':'📋 Καταγραφή κλικ';
  btn.style.background  =state.logMode?'var(--danger-bg)':'';
  btn.style.color       =state.logMode?'var(--danger-text)':'';
  btn.style.borderColor =state.logMode?'var(--danger-text)':'';
  if(!state.running) draw();
}

function applyVelVis(){
  document.getElementById('vel-card').style.display=showVel?'':'none';
  const btn=document.getElementById('btn-tog-v');
  btn.textContent=showVel?'v εμφανής':'v κρυφή';
  btn.classList.toggle('toggled',!showVel);
  btn.classList.toggle('active',showVel);
}
function applyVLogVis(){
  document.querySelectorAll('.col-v-h').forEach(el=>el.classList.toggle('hidden',!showVLog));
  const btn=document.getElementById('tog-v-log');
  btn.textContent=showVLog?'εμφανής':'κρυφή';
  btn.classList.toggle('toggled',!showVLog);
  btn.classList.toggle('active',showVLog);
}

/* Canvas click */
canvas.addEventListener('click',function(e){
  if(isFS()){
    const rect=canvas.getBoundingClientRect();
    const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    const cx=(e.clientX-rect.left)*sx, cy=(e.clientY-rect.top)*sy;
    for(const b of getFSBtnRects(canvas.width,canvas.height)){
      if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){
        if(b.id==='play')    { toggleRun(); draw(); return; }
        if(b.id==='restart') { resetSim(); return; }
        if(b.id==='log')     { toggleLog(); return; }
      }
    }
    if(state.logMode) addLogPoint();
    return;
  }
  if(state.logMode) addLogPoint();
});

function addLogPoint(){
  logData.push({n:logData.length+1,t:state.t,x:state.x,v:state.v});
  const row=document.createElement('tr');
  const last=logData[logData.length-1];
  row.innerHTML=`<td>${last.n}</td><td>${last.t.toFixed(3)}</td><td>${last.x.toFixed(3)}</td><td class="col-v-h${showVLog?'':' hidden'}">${last.v.toFixed(3)}</td>`;
  document.getElementById('log-body').appendChild(row);
  document.getElementById('log-count').textContent=logData.length+' σημεία';
  document.querySelector('.log-wrap').scrollTop=9999;
}

/* Fullscreen */
document.getElementById('btn-fullscreen').addEventListener('click',function(){
  const el=document.getElementById('stage-wrap');
  if(!isFS()) (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else        (document.exitFullscreen||document.webkitExitFullscreen).call(document);
});
function onFSChange(){
  document.getElementById('btn-fullscreen').textContent=isFS()?'✕ Έξοδος':'⛶ Πλήρης οθόνη';
  setTimeout(()=>{ resize(); draw(); },60);
}
document.addEventListener('fullscreenchange',onFSChange);
document.addEventListener('webkitfullscreenchange',onFSChange);

/* Speed buttons */
document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    simSpeed=parseFloat(this.dataset.speed);
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('sel'));
    this.classList.add('sel');
    if(!state.running) draw();
  });
});

/* Main buttons */
document.getElementById('btn-start').addEventListener('click',toggleRun);
document.getElementById('btn-reset').addEventListener('click',resetSim);
document.getElementById('btn-tog-v').addEventListener('click',()=>{showVel=!showVel;applyVelVis();});
document.getElementById('tog-v-log').addEventListener('click',()=>{showVLog=!showVLog;applyVLogVis();});
document.getElementById('btn-log').addEventListener('click',toggleLog);
document.getElementById('btn-clear-log').addEventListener('click',clearLog);

/* Sliders */
['v0','angle','mu','mass'].forEach(id=>{
  const el=document.getElementById(id);
  const out=document.getElementById(id+'-val');
  el.addEventListener('input',function(){
    const val=parseFloat(this.value);
    if(id==='v0') out.textContent=val.toFixed(1);
    else if(id==='mu') out.textContent=val.toFixed(2);
    else if(id==='mass') out.textContent=val.toFixed(1);
    else out.textContent=val+'°';
    if(!state.running) resetSim();
  });
});

applyVelVis(); applyVLogVis();
resize();
window.addEventListener('resize',()=>{ resize(); draw(); });
draw();
</script>
</body>
</html>
