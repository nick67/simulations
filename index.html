<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Φυσική — Προσομοιώσεις</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(100,160,255,0.45);
    --text: #e8eaf0;
    --muted: #8890a8;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --tag-bg: rgba(79,142,247,0.12);
    --tag-text: #7ab4ff;
    --card-radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 3rem 2rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 0.5rem;
  }

  .logo {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 0.3rem;
    margin-left: 56px;
  }

  .controls {
    max-width: 1100px;
    margin: 1.8rem auto 0;
    padding: 0 2rem;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 340px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 0.5rem 0.75rem 0.5rem 2.4rem;
    outline: none;
    transition: border-color .2s;
  }
  input[type="search"]:focus { border-color: var(--accent); }

  .tag-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 4px 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .tag-btn.active, .tag-btn:hover {
    background: var(--tag-bg);
    border-color: var(--accent);
    color: var(--tag-text);
  }

  .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin-left: auto;
  }

  main {
    max-width: 1100px;
    margin: 1.8rem auto 4rem;
    padding: 0 2rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 1.4rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color .2s, background .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(79,142,247,0.04), transparent 60%);
    opacity: 0;
    transition: opacity .2s;
  }

  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg3);
    transform: translateY(-2px);
  }
  .card:hover::before { opacity: 1; }

  .card-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-file {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    margin-top: auto;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid rgba(79,142,247,0.2);
  }

  .card-arrow {
    position: absolute;
    top: 1.2rem; right: 1.2rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity .2s;
    font-size: 16px;
  }
  .card:hover .card-arrow { opacity: 1; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 3rem;
    font-size: 0.95rem;
    display: none;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-bottom: 2rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">⚛</div>
    <h1>Προσομοιώσεις Φυσικής</h1>
  </div>
  <p class="subtitle">Διαδραστικές προσομοιώσεις για τη διδασκαλία της Φυσικής</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Αναζήτηση προσομοίωσης…" autocomplete="off">
  </div>
  <div class="tag-filter" id="tagFilter"></div>
  <span class="count" id="count"></span>
</div>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Δεν βρέθηκαν προσομοιώσεις.</p>
</main>

<footer>
  <p id="footerCount"></p>
</footer>

<script>
const simulations = [
  {
    file: "dissolution_simulation.html",
    title: "Προσομοίωση Διάλυσης",
    icon: "🧪",
    tags: ["Χημεία", "Ρευστά"]
  },
  {
    file: "electron_flow_simulation.html",
    title: "Ροή Ηλεκτρονίων",
    icon: "⚡",
    tags: ["Ηλεκτρισμός"]
  },
  {
    file: "hourglass-hydrostatic-pressure-sim.html",
    title: "Κλεψύδρα — Υδροστατική Πίεση",
    icon: "🌊",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "hourglass-lab.html",
    title: "Εργαστήριο Κλεψύδρας",
    icon: "⏳",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "hourglass_simulation.html",
    title: "Προσομοίωση Κλεψύδρας (Άμμος)",
    icon: "⏳",
    tags: ["Κοκκώδη Μέσα", "Κλεψύδρα"]
  },
  {
    file: "klepsydra_nerou_staueri_roi.html",
    title: "Κλεψύδρα Νερού — Σταθερή Ροή",
    icon: "💧",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "klepsydra_torricelli_v2.html",
    title: "Κλεψύδρα Torricelli v2",
    icon: "💧",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "klepsydra_water_clock_simulation.html",
    title: "Υδρόλογο — Water Clock",
    icon: "🕰️",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "newtonian_second_law.html",
    title: "Δεύτερος Νόμος του Νεύτωνα",
    icon: "🔴",
    tags: ["Μηχανική"]
  },
  {
    file: "prosomoiosi_eythygrammi_kinisi.html",
    title: "Ευθύγραμμη Κίνηση",
    icon: "➡️",
    tags: ["Μηχανική"]
  },
  {
    file: "water-hourglass-lab.html",
    title: "Εργαστήριο Υδάτινης Κλεψύδρας",
    icon: "🔬",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "water-hourglass.html",
    title: "Κλεψύδρα Νερού",
    icon: "💧",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
  {
    file: "water_hourglass_simulation.html",
    title: "Προσομοίωση Κλεψύδρας Νερού",
    icon: "💧",
    tags: ["Ρευστά", "Κλεψύδρα"]
  },
];

const allTags = [...new Set(simulations.flatMap(s => s.tags || []))].sort();

const tagFilter = document.getElementById('tagFilter');
let activeTag = null;

const allBtn = document.createElement('button');
allBtn.className = 'tag-btn active';
allBtn.textContent = 'Όλες';
allBtn.onclick = () => setTag(null, allBtn);
tagFilter.appendChild(allBtn);

allTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.textContent = tag;
  btn.onclick = () => setTag(tag, btn);
  tagFilter.appendChild(btn);
});

function setTag(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');

  const filtered = simulations.filter(s => {
    const title = s.title.toLowerCase();
    const matchQ = !q || title.includes(q) || s.file.toLowerCase().includes(q) || (s.tags||[]).join(' ').toLowerCase().includes(q);
    const matchTag = !activeTag || (s.tags || []).includes(activeTag);
    return matchQ && matchTag;
  });

  grid.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    filtered.forEach(sim => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = sim.file;
      a.innerHTML = `
        <div class="card-arrow">↗</div>
        <div class="card-icon">${sim.icon}</div>
        <div class="card-title">${sim.title}</div>
        <div class="card-tags">${(sim.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="card-file">${sim.file}</div>
      `;
      grid.appendChild(a);
    });
  }

  const total = simulations.length;
  countEl.textContent = filtered.length < total
    ? `${filtered.length} από ${total}`
    : `${total} προσομοιώσεις`;

  document.getElementById('footerCount').textContent =
    `${total} διαδραστικές προσομοιώσεις`;
}

document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
