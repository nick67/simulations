<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sim Manager — Προσομοιώσεις</title>
<style>
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a; --bg4: #2a2f45;
  --border: rgba(255,255,255,0.08); --border-accent: rgba(79,142,247,0.4);
  --text: #e8eaf0; --muted: #8890a8; --muted2: #555d78;
  --accent: #4f8ef7; --accent2: #7c5cfc; --green: #3ecf8e; --red: #f87171; --yellow: #fbbf24;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

/* ── Layout ── */
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

/* ── Sidebar ── */
aside {
  background: var(--bg2); border-right: 1px solid var(--border);
  padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 0 0.5rem; }
.logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.logo h1 { font-size: 1rem; font-weight: 700; }
.logo small { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 400; }

.repo-box { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.8rem; }
.repo-box label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }
.repo-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.78rem; padding: 5px 8px; outline: none; font-family: monospace; }
.repo-box input:focus { border-color: var(--accent); }
.repo-status { font-size: 0.72rem; margin-top: 5px; }
.repo-status.ok { color: var(--green); }
.repo-status.err { color: var(--red); }

nav { display: flex; flex-direction: column; gap: 4px; }
nav label { font-size: 0.7rem; color: var(--muted2); text-transform: uppercase; letter-spacing: .05em; padding: 0 0.5rem; margin-bottom: 2px; }
.nav-btn {
  background: none; border: none; color: var(--muted); font-size: 0.88rem;
  padding: 8px 10px; border-radius: 7px; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 8px; transition: all .15s; width: 100%;
}
.nav-btn:hover { background: var(--bg3); color: var(--text); }
.nav-btn.active { background: var(--bg4); color: var(--accent); }
.nav-btn .badge { margin-left: auto; background: var(--bg4); color: var(--muted); font-size: 0.7rem; padding: 1px 7px; border-radius: 20px; }

.git-actions { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.git-actions label { font-size: 0.7rem; color: var(--muted2); text-transform: uppercase; letter-spacing: .05em; }
.btn { border: none; border-radius: 7px; font-size: 0.85rem; padding: 8px 12px; cursor: pointer; font-weight: 500; transition: all .15s; display: flex; align-items: center; gap: 6px; justify-content: center; }
.btn-pull { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-pull:hover { border-color: var(--accent); color: var(--accent); }
.btn-push { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.btn-push:hover { opacity: .85; }
.btn-save { background: var(--green); color: #0f1a14; font-weight: 600; }
.btn-save:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── Main ── */
main { padding: 2rem; overflow-y: auto; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.toolbar h2 { font-size: 1.2rem; font-weight: 600; }
.toolbar-right { margin-left: auto; display: flex; gap: 8px; }
input[type=search], input[type=text] {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-size: 0.85rem; padding: 6px 12px; outline: none; transition: border .15s;
}
input[type=search]:focus, input[type=text]:focus { border-color: var(--accent); }

/* ── Table ── */
.sim-table { width: 100%; border-collapse: collapse; }
.sim-table th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
.sim-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.sim-table tr:hover td { background: var(--bg2); }

.icon-picker { position: relative; display: inline-block; }
.icon-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; transition: border .15s; }
.icon-btn:hover { border-color: var(--accent); }
.icon-dropdown { display: none; position: absolute; top: 40px; left: 0; background: var(--bg3); border: 1px solid var(--border-accent); border-radius: 8px; padding: 6px; z-index: 100; display: none; flex-wrap: wrap; gap: 4px; width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.icon-dropdown.open { display: flex; }
.icon-opt { background: none; border: 1px solid transparent; border-radius: 5px; font-size: 18px; cursor: pointer; width: 30px; height: 30px; }
.icon-opt:hover { border-color: var(--accent); background: var(--bg4); }

.title-input { background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); font-size: 0.9rem; padding: 4px 8px; width: 100%; min-width: 160px; transition: all .15s; }
.title-input:hover { border-color: var(--border); background: var(--bg2); }
.title-input:focus { border-color: var(--accent); background: var(--bg2); outline: none; }

.tags-cell { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tag-chip {
  background: rgba(79,142,247,0.12); color: #7ab4ff; font-size: 0.72rem;
  padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(79,142,247,0.25);
  display: flex; align-items: center; gap: 4px; cursor: default;
}
.tag-chip .rm { background: none; border: none; color: #7ab4ff; cursor: pointer; font-size: 10px; padding: 0; line-height: 1; opacity: .6; }
.tag-chip .rm:hover { opacity: 1; }
.tag-add { background: var(--bg3); border: 1px dashed var(--border); color: var(--muted); font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; cursor: pointer; transition: all .15s; }
.tag-add:hover { border-color: var(--accent); color: var(--accent); }
.tag-selector { display: none; position: absolute; background: var(--bg3); border: 1px solid var(--border-accent); border-radius: 8px; padding: 6px; z-index: 100; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.tag-selector.open { display: block; }
.tag-selector button { display: block; width: 100%; background: none; border: none; color: var(--text); font-size: 0.82rem; padding: 5px 10px; text-align: left; cursor: pointer; border-radius: 5px; }
.tag-selector button:hover { background: var(--bg4); color: var(--accent); }

.file-name { font-family: monospace; font-size: 0.78rem; color: var(--muted); }

/* ── Log panel ── */
.log-panel {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  margin-top: 1.5rem; overflow: hidden;
}
.log-header { padding: 8px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted2); }
.log-dot.running { background: var(--yellow); animation: pulse 1s infinite; }
.log-dot.ok { background: var(--green); }
.log-dot.err { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.log-body { padding: 10px 14px; font-family: monospace; font-size: 0.8rem; min-height: 60px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: #a8b4cc; }
.log-body .ok { color: var(--green); }
.log-body .err { color: var(--red); }

/* ── Toast ── */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--bg3); border: 1px solid var(--border-accent); border-radius: var(--radius); padding: 10px 16px; font-size: 0.85rem; z-index: 999; transform: translateY(80px); opacity: 0; transition: all .25s; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok { border-color: rgba(62,207,142,.4); color: var(--green); }
.toast.err { border-color: rgba(248,113,113,.4); color: var(--red); }

/* ── Changed indicator ── */
tr.changed td:first-child { border-left: 2px solid var(--accent); }
</style>
</head>
<body>
<div class="app">

<!-- ── Sidebar ── -->
<aside>
  <div class="logo">
    <div class="logo-icon">⚛</div>
    <h1>Sim Manager<small>Προσομοιώσεις Φυσικής</small></h1>
  </div>

  <div class="repo-box">
    <label>Φάκελος Repo</label>
    <input type="text" id="repoPath" value="{{ repo_dir }}" placeholder="~/simulations">
    <div class="repo-status {% if repo_ok %}ok{% else %}err{% endif %}" id="repoStatus">
      {% if repo_ok %}✅ Βρέθηκε{% else %}❌ Δεν βρέθηκε{% endif %}
    </div>
  </div>

  <nav>
    <label>Προβολή</label>
    <button class="nav-btn active" onclick="showAll()">
      📋 Όλες οι Προσομοιώσεις
      <span class="badge" id="totalBadge">{{ sims|length }}</span>
    </button>
    {% for tag in all_tags %}
    <button class="nav-btn" onclick="filterTag('{{ tag }}')">
      🏷 {{ tag }}
    </button>
    {% endfor %}
  </nav>

  <div class="git-actions">
    <label>Git Actions</label>
    <button class="btn btn-pull" onclick="gitAction('pull')" id="btnPull">⬇ Git Pull</button>
    <button class="btn btn-save" onclick="saveAll()" id="btnSave">💾 Αποθήκευση</button>
    <button class="btn btn-push" onclick="gitAction('push')" id="btnPush">⬆ Commit & Push</button>
  </div>
</aside>

<!-- ── Main ── -->
<main>
  <div class="toolbar">
    <h2>Προσομοιώσεις <span id="filterLabel" style="color:var(--muted);font-weight:400;font-size:0.95rem"></span></h2>
    <div class="toolbar-right">
      <input type="search" id="search" placeholder="Αναζήτηση…" oninput="filterSearch()">
    </div>
  </div>

  <table class="sim-table" id="simTable">
    <thead>
      <tr>
        <th>Icon</th>
        <th>Τίτλος</th>
        <th>Tags</th>
        <th>Αρχείο</th>
      </tr>
    </thead>
    <tbody id="simBody"></tbody>
  </table>

  <div class="log-panel" id="logPanel" style="display:none">
    <div class="log-header">
      <div class="log-dot" id="logDot"></div>
      <span id="logTitle">Αποτέλεσμα</span>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</main>
</div>

<div class="toast" id="toast"></div>

<!-- Tag selector (shared, moved dynamically) -->
<div class="tag-selector" id="tagSelector">
  {% for tag in all_tags %}
  <button onclick="addTagFromSelector('{{ tag }}')">{{ tag }}</button>
  {% endfor %}
  <button onclick="addCustomTag()" style="color:var(--accent)">+ Νέο tag…</button>
</div>

<script>
const ALL_ICONS = {{ all_icons | tojson }};
let simulations = {{ sims | tojson }};
let activeTag = null;
let activeIconRow = null;
let activeTagRow = null;

// ── Render table ─────────────────────────────────────────────────────────────
function render(data) {
  const tbody = document.getElementById('simBody');
  tbody.innerHTML = '';
  data.forEach((sim, i) => {
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td>
        <div class="icon-picker">
          <button class="icon-btn" onclick="toggleIconPicker(this, ${i})">${sim.icon}</button>
          <div class="icon-dropdown" id="iconDrop${i}">
            ${ALL_ICONS.map(ic => `<button class="icon-opt" onclick="setIcon(${i},'${ic}')">${ic}</button>`).join('')}
          </div>
        </div>
      </td>
      <td><input class="title-input" value="${escHtml(sim.title)}" oninput="setTitle(${i}, this.value)" onchange="markChanged(${i})"></td>
      <td>
        <div class="tags-cell" id="tagCell${i}">
          ${sim.tags.map(t => tagChip(t, i)).join('')}
          <div style="position:relative">
            <button class="tag-add" onclick="openTagSelector(${i}, this)">+ tag</button>
          </div>
        </div>
      </td>
      <td><span class="file-name">${sim.file}</span></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('totalBadge').textContent = simulations.length;
}

function tagChip(t, i) {
  return `<span class="tag-chip">${t}<button class="rm" onclick="removeTag(${i},'${t}')">✕</button></span>`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Icon picker ───────────────────────────────────────────────────────────────
function toggleIconPicker(btn, i) {
  const drop = document.getElementById('iconDrop'+i);
  const isOpen = drop.classList.contains('open');
  document.querySelectorAll('.icon-dropdown').forEach(d => d.classList.remove('open'));
  if (!isOpen) drop.classList.add('open');
}

function setIcon(i, icon) {
  simulations[i].icon = icon;
  document.querySelectorAll('.icon-dropdown').forEach(d => d.classList.remove('open'));
  markChanged(i);
  renderFiltered();
}

// ── Title ─────────────────────────────────────────────────────────────────────
function setTitle(i, val) { simulations[i].title = val; }

// ── Tags ──────────────────────────────────────────────────────────────────────
function removeTag(i, tag) {
  simulations[i].tags = simulations[i].tags.filter(t => t !== tag);
  markChanged(i);
  renderFiltered();
}

function openTagSelector(i, btn) {
  activeTagRow = i;
  const sel = document.getElementById('tagSelector');
  const rect = btn.getBoundingClientRect();
  sel.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  sel.style.left = (rect.left + window.scrollX) + 'px';
  sel.style.position = 'absolute';
  document.body.appendChild(sel);
  sel.classList.add('open');
}

function addTagFromSelector(tag) {
  if (activeTagRow === null) return;
  if (!simulations[activeTagRow].tags.includes(tag)) {
    simulations[activeTagRow].tags.push(tag);
    markChanged(activeTagRow);
    renderFiltered();
  }
  closeTagSelector();
}

function addCustomTag() {
  const tag = prompt('Νέο tag:');
  if (tag && tag.trim()) addTagFromSelector(tag.trim());
}

function closeTagSelector() {
  document.getElementById('tagSelector').classList.remove('open');
  activeTagRow = null;
}

document.addEventListener('click', e => {
  if (!e.target.closest('.tag-selector') && !e.target.closest('.tag-add'))
    closeTagSelector();
  if (!e.target.closest('.icon-picker'))
    document.querySelectorAll('.icon-dropdown').forEach(d => d.classList.remove('open'));
});

// ── Changed marker ────────────────────────────────────────────────────────────
function markChanged(i) {
  const rows = document.querySelectorAll('#simBody tr');
  rows.forEach(tr => { if (parseInt(tr.dataset.idx) === i) tr.classList.add('changed'); });
}

// ── Filter ────────────────────────────────────────────────────────────────────
function showAll() {
  activeTag = null;
  document.getElementById('filterLabel').textContent = '';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.closest('.nav-btn').classList.add('active');
  renderFiltered();
}

function filterTag(tag) {
  activeTag = tag;
  document.getElementById('filterLabel').textContent = '— ' + tag;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderFiltered();
}

function filterSearch() { renderFiltered(); }

function renderFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  let data = simulations.map((s, i) => ({...s, _i: i}));
  if (activeTag) data = data.filter(s => s.tags.includes(activeTag));
  if (q) data = data.filter(s => s.title.toLowerCase().includes(q) || s.file.toLowerCase().includes(q));
  // re-render with original indices
  const tbody = document.getElementById('simBody');
  tbody.innerHTML = '';
  data.forEach(sim => {
    const i = sim._i;
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td>
        <div class="icon-picker">
          <button class="icon-btn" onclick="toggleIconPicker(this, ${i})">${sim.icon}</button>
          <div class="icon-dropdown" id="iconDrop${i}">
            ${ALL_ICONS.map(ic => `<button class="icon-opt" onclick="setIcon(${i},'${ic}')">${ic}</button>`).join('')}
          </div>
        </div>
      </td>
      <td><input class="title-input" value="${escHtml(sim.title)}" oninput="setTitle(${i}, this.value)" onchange="markChanged(${i})"></td>
      <td>
        <div class="tags-cell" id="tagCell${i}">
          ${sim.tags.map(t => tagChip(t, i)).join('')}
          <div style="position:relative">
            <button class="tag-add" onclick="openTagSelector(${i}, this)">+ tag</button>
          </div>
        </div>
      </td>
      <td><span class="file-name">${sim.file}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveAll() {
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '⏳ Αποθήκευση…';
  const res = await fetch('/api/save', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(simulations)
  });
  const data = await res.json();
  btn.disabled = false; btn.textContent = '💾 Αποθήκευση';
  showToast(data.message, data.ok ? 'ok' : 'err');
  document.querySelectorAll('#simBody tr').forEach(tr => tr.classList.remove('changed'));
}

// ── Git ───────────────────────────────────────────────────────────────────────
function gitAction(action) {
  const panel = document.getElementById('logPanel');
  const body  = document.getElementById('logBody');
  const dot   = document.getElementById('logDot');
  const title = document.getElementById('logTitle');
  panel.style.display = 'block';
  body.innerHTML = '';
  dot.className = 'log-dot running';
  title.textContent = action === 'pull' ? '⬇ Git Pull' : '⬆ Commit & Push';

  document.getElementById(action === 'pull' ? 'btnPull' : 'btnPush').disabled = true;

  const es = new EventSource('/api/git/' + action);
  es.onmessage = e => {
    const line = e.data;
    if (line.startsWith('__EXIT__')) {
      es.close();
      const ok = line === '__EXIT__0';
      dot.className = 'log-dot ' + (ok ? 'ok' : 'err');
      document.getElementById(action === 'pull' ? 'btnPull' : 'btnPush').disabled = false;
      if (ok && action === 'pull') { setTimeout(() => location.reload(), 800); }
      return;
    }
    const span = document.createElement('span');
    span.className = line.startsWith('❌') ? 'err' : line.startsWith('✅') ? 'ok' : '';
    span.textContent = line + '\n';
    body.appendChild(span);
    body.scrollTop = body.scrollHeight;
  };
}

// ── Repo path ─────────────────────────────────────────────────────────────────
document.getElementById('repoPath').addEventListener('change', async function() {
  const res = await fetch('/api/repo_dir', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({path: this.value})
  });
  const data = await res.json();
  const status = document.getElementById('repoStatus');
  status.textContent = data.message;
  status.className = 'repo-status ' + (data.ok ? 'ok' : 'err');
  if (data.ok) setTimeout(() => location.reload(), 500);
});

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderFiltered();
</script>
</body>
</html>
