<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Κίνηση Ηλεκτρονίων σε Μεταλλικό Αγωγό</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #ddd; }
      .card { background: #252525; border-color: #333; }
      canvas { background: #1e2a1e; border-color: #3a5a3a; }
      .mat-btn { background: #2a2a2a; border-color: #444; color: #ccc; }
      .mat-btn.active { background: #333; border-color: #666; color: #eee; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .card {
      background: #fff;
      border: 1px solid #d8dcd8;
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctrl-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @media (prefers-color-scheme: dark) {
      .ctrl-label { color: #999; }
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-row input[type=range] {
      flex: 1;
      min-width: 160px;
      accent-color: #378ADD;
      cursor: pointer;
    }

    .ctrl-val {
      font-size: 15px;
      font-weight: 600;
      min-width: 32px;
      text-align: right;
      color: #378ADD;
    }

    .material-btns { display: flex; gap: 8px; }

    .mat-btn {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      cursor: pointer;
      transition: all 0.15s;
      color: #333;
    }

    .mat-btn:hover { border-color: #999; }

    .mat-btn.active {
      background: #378ADD;
      border-color: #185FA5;
      color: #fff;
    }

    canvas {
      display: block;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #c8d8c8;
      background: #e8f5e9;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      .leg-item { color: #aaa; }
    }

    .leg-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .leg-dot.elec { background: #378ADD; }

    #info-text {
      margin-left: auto;
      font-size: 12px;
      color: #555;
      font-style: italic;
    }

    @media (prefers-color-scheme: dark) {
      #info-text { color: #aaa; }
    }

    .footer {
      margin-top: 0.75rem;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Κίνηση Ηλεκτρονίων σε Μεταλλικό Αγωγό</h1>

  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Υλικό αγωγού</span>
      <div class="material-btns">
        <button class="mat-btn active" id="btn-cu" onclick="setMaterial('cu')">Χαλκός (Cu)</button>
        <button class="mat-btn" id="btn-fe" onclick="setMaterial('fe')">Σίδηρος (Fe)</button>
      </div>
    </div>
    <div class="ctrl-group" style="flex:1; min-width:200px;">
      <span class="ctrl-label">Διαφορά δυναμικού V<sub>A</sub> − V<sub>B</sub></span>
      <div class="ctrl-row">
        <span style="font-size:12px;color:#888">−</span>
        <input type="range" id="voltage" min="-5" max="5" step="1" value="3" oninput="updateVoltage(this.value)">
        <span style="font-size:12px;color:#888">+</span>
        <span class="ctrl-val" id="volt-display">+3</span>
      </div>
    </div>
  </div>

  <canvas id="sim" height="200"></canvas>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot elec"></div>Ελεύθερα ηλεκτρόνια (e⁻)</div>
    <div class="leg-item">
      <div class="leg-dot" id="leg-ion" style="background:#E24B4A;"></div>
      <span id="leg-ion-label">Ιόντα Cu²⁺</span>
    </div>
    <span id="info-text"></span>
  </div>
</div>

<div class="footer">Φυσική Λυκείου · Ηλεκτρικό Ρεύμα · Προσομοίωση</div>

<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');

let material = 'cu';
let voltage = 3;

const MAT = {
  cu: { name:'Cu', ionColor:'#E24B4A', ionLabel:'Ιόντα Cu²⁺', resistivity: 1, ionSize: 9, electronCount: 28 },
  fe: { name:'Fe', ionColor:'#BA7517', ionLabel:'Ιόντα Fe²⁺', resistivity: 7, ionSize: 11, electronCount: 20 }
};

const W = 680, H = 200;
canvas.width = W; canvas.height = H;

const PAD = 40, CY1 = 50, CY2 = 150;
const CX1 = PAD + 60, CX2 = W - PAD - 60;

let electrons = [], ions = [];

function setMaterial(m) {
  material = m;
  document.getElementById('btn-cu').classList.toggle('active', m==='cu');
  document.getElementById('btn-fe').classList.toggle('active', m==='fe');
  document.getElementById('leg-ion').style.background = MAT[m].ionColor;
  document.getElementById('leg-ion-label').textContent = MAT[m].ionLabel;
  initElectrons();
}

function updateVoltage(v) {
  voltage = parseInt(v);
  document.getElementById('volt-display').textContent = voltage > 0 ? '+'+voltage : ''+voltage;
  updateInfo();
}

function updateInfo() {
  const info = document.getElementById('info-text');
  if (voltage === 0) {
    info.textContent = 'ΔV = 0 → Δεν ρέει ρεύμα';
  } else {
    const dir  = voltage > 0 ? 'A → B' : 'B → A';
    const edir = voltage > 0 ? 'B → A' : 'A → B';
    info.textContent = 'Ρεύμα: ' + dir + '  |  Ηλεκτρόνια: ' + edir;
  }
}

function initElectrons() {
  const m = MAT[material];
  electrons = [];
  const cw = CX2 - CX1, ch = CY2 - CY1;
  for (let i = 0; i < m.electronCount; i++) {
    electrons.push({
      x: CX1 + Math.random() * cw,
      y: CY1 + Math.random() * ch,
      vy: (Math.random() - 0.5) * 1.5,
      thermal_vx: (Math.random() - 0.5) * 1.5,
      scatter_t: Math.random() * 60
    });
  }
  initIons();
  updateInfo();
}

function initIons() {
  ions = [];
  const cols = 12, rows = 4;
  const cw = CX2 - CX1, ch = CY2 - CY1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ions.push({
        x: CX1 + (c + 0.5) * (cw / cols),
        y: CY1 + (r + 0.5) * (ch / rows),
        phase: Math.random() * Math.PI * 2
      });
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const conductorFill   = isDark ? '#1e2a1e' : '#e8f5e9';
  const conductorStroke = isDark ? '#3a5a3a' : '#aac8aa';
  const textColor       = isDark ? '#bbb'    : '#555';
  const wireColor       = isDark ? '#555'    : '#aaa';
  const bgColor         = isDark ? '#252525' : '#ffffff';

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  // Σύρματα σύνδεσης
  const midY = (CY1 + CY2) / 2;
  ctx.strokeStyle = wireColor;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, midY); ctx.lineTo(CX1, midY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX2, midY); ctx.lineTo(W - PAD, midY); ctx.stroke();

  // Αγωγός
  ctx.fillStyle = conductorFill;
  ctx.strokeStyle = conductorStroke;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(CX1, CY1, CX2 - CX1, CY2 - CY1, 8);
  ctx.fill(); ctx.stroke();

  // Ετικέτα υλικού
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.fillText(MAT[material].name, (CX1 + CX2) / 2, CY1 - 10);

  // Σημεία A και B
  ctx.font = 'bold 15px system-ui, sans-serif';
  const colA = voltage > 0 ? '#D85A30' : voltage < 0 ? '#378ADD' : textColor;
  const colB = voltage > 0 ? '#378ADD' : voltage < 0 ? '#D85A30' : textColor;
  ctx.fillStyle = colA; ctx.textAlign = 'center';
  ctx.fillText('A', PAD + 18, midY - 12);
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = colA;
  ctx.fillText(voltage > 0 ? '(+)' : voltage < 0 ? '(−)' : '', PAD + 18, midY + 18);
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = colB;
  ctx.fillText('B', W - PAD - 18, midY - 12);
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = colB;
  ctx.fillText(voltage > 0 ? '(−)' : voltage < 0 ? '(+)' : '', W - PAD - 18, midY + 18);

  // Τελείες A & B
  [PAD + 18, W - PAD - 18].forEach((x, i) => {
    ctx.beginPath();
    ctx.arc(x, midY, 5, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? colA : colB;
    ctx.fill();
  });

  const t = Date.now() / 1000;
  const m = MAT[material];

  // Ιόντα πλέγματος
  ions.forEach(ion => {
    const vib = voltage !== 0 ? 1.2 + Math.abs(voltage) * 0.15 : 0.5;
    const jitter = vib * m.resistivity / 4;
    const dx = Math.sin(t * 8 + ion.phase) * jitter;
    const dy = Math.cos(t * 6 + ion.phase * 1.3) * jitter;

    ctx.beginPath();
    ctx.arc(ion.x + dx, ion.y + dy, m.ionSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = m.ionColor + '44';
    ctx.fill();
    ctx.strokeStyle = m.ionColor;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = `bold ${m.ionSize - 2}px sans-serif`;
    ctx.fillStyle = m.ionColor;
    ctx.textAlign = 'center';
    ctx.fillText('+', ion.x + dx, ion.y + dy + (m.ionSize - 2) / 2 - 1);
  });

  // Ηλεκτρόνια
  const drift_speed = voltage === 0 ? 0 : (Math.abs(voltage) / m.resistivity) * 0.4;
  const drift_dir = voltage > 0 ? -1 : 1;

  electrons.forEach(e => {
    e.scatter_t -= 1;
    if (e.scatter_t <= 0) {
      e.thermal_vx = (Math.random() - 0.5) * 2;
      e.vy = (Math.random() - 0.5) * 2;
      e.scatter_t = 20 + Math.random() * 40 * (1 / (1 + Math.abs(voltage) * 0.3));
    }
    e.x += e.thermal_vx + drift_dir * drift_speed;
    e.y += e.vy;
    if (e.x < CX1) e.x = CX2 - 2;
    if (e.x > CX2) e.x = CX1 + 2;
    if (e.y < CY1 + 4) { e.y = CY1 + 4; e.vy *= -1; }
    if (e.y > CY2 - 4) { e.y = CY2 - 4; e.vy *= -1; }

    ctx.beginPath();
    ctx.arc(e.x, e.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#378ADD';
    ctx.fill();
    ctx.strokeStyle = '#185FA5';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.font = 'bold 9px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('−', e.x, e.y + 3.5);
  });

  // Βέλος κατεύθυνσης ηλεκτρονίων
  if (voltage !== 0) {
    const arrowDir = voltage > 0 ? -1 : 1;
    const ay = midY;
    const arrowX = arrowDir === -1 ? CX1 - 22 : CX2 + 22;
    ctx.beginPath();
    ctx.moveTo(arrowX, ay);
    ctx.lineTo(arrowX + arrowDir * 18, ay);
    ctx.strokeStyle = '#378ADD';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(arrowX + arrowDir * 18, ay);
    ctx.lineTo(arrowX + arrowDir * 10, ay - 5);
    ctx.lineTo(arrowX + arrowDir * 10, ay + 5);
    ctx.closePath();
    ctx.fillStyle = '#378ADD';
    ctx.fill();
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#378ADD';
    ctx.textAlign = 'center';
    ctx.fillText('e⁻', arrowX + arrowDir * 9, ay - 11);
  }

  requestAnimationFrame(draw);
}

initElectrons();
draw();
</script>
</body>
</html>
